<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>00:00:00</title>
  <meta name="description" content="Title üzerinden saniyesine kadar anlık takip edilebilen hassas dijital saat">
  
  <!-- Şeffaf Favicon (Sekme başlığında hiçbir logo/ikon görünmez) -->
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>">
  
  <!-- Modern İnce & Zarif Monospace Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hafif teknik arka plan ızgarası -->
  <div class="grid-overlay"></div>

  <!-- Ana Kapsayıcı -->
  <main class="app-container" id="app">
    
    <!-- Üst Kontrol Çubuğu (Yalnızca minimal sağ kontroller) -->
    <header class="top-bar">
      <div class="actions-group">
        <button id="btn-sound" class="btn-icon" title="Saniye Tik-Tak Sesi (Aç/Kapat)" aria-label="Saniye sesi">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path id="sound-icon-off" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/>
            <path id="sound-icon-on" style="display:none;" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>

        <button id="btn-zen" class="btn-icon" title="Minimal Zen Modu (+ veya Z)" aria-label="Zen modu">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path id="zen-icon-open" d="M12 4v16m8-8H4"/>
            <path id="zen-icon-close" style="display:none;" d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>

        <button id="btn-fullscreen" class="btn-icon" title="Tam Ekran (F)" aria-label="Tam ekran">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Zen modunda görünen çıkış ipucu -->
    <div id="zen-exit-hint" class="zen-exit-hint">
      Geri dönmek için ekrana tıklayın veya <span>Esc</span> / <span>+</span> tuşuna basın
    </div>

    <!-- Saat Kahraman Alanı (Tamamen ve sadece saat) -->
    <section class="clock-hero">
      <div class="digital-display">
        <div class="time-segments" id="time-display">
          <span id="hours" class="digit">00</span>
          <span class="colon colon-1">:</span>
          <span id="minutes" class="digit">00</span>
          <span class="colon colon-2">:</span>
          <span id="seconds" class="digit">00</span>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
